name: build-firmware
# Builds the installable package (build/felucca.fwsc) with JieLi's Linux toolchain, runs the host tests and, on main,
# publishes the package as a GitHub release you can download and install from the browser installer.
on:
  push:
    branches: [main, 'quest-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow numpy
      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh
      - name: JieLi AC79 SDK (only three files are used; build.py checks their SHA-256)
        run: |
          B=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK/raw/AC79NN_SDK_V1.2.1_2023-12-13/cpu/wl82/tools
          D=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          mkdir -p $D/cfg
          curl -fL --retry 5 -o $D/uboot.boot $B/uboot.boot
          curl -fL --retry 5 -o $D/cfg_tool.bin $B/cfg_tool.bin
          curl -fL --retry 5 -o $D/cfg/eq_cfg_hw.bin $B/cfg/eq_cfg_hw.bin
      - name: Build
        run: ./build.sh --release quest-${{ github.run_number }}
      - name: Size of the app
        run: ls -l build/felucca.bin build/felucca.fwsc build/loader/ota.bin
      - name: Host tests
        run: sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-quest-firmware
          path: |
            build/felucca-*.fwsc
            build/felucca.bin
      - name: Release (main only)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          F=$(ls build/felucca-*.fwsc | head -1)
          gh release create "quest-${{ github.run_number }}" "$F" --title "FM1 Quest build ${{ github.run_number }}" \
            --notes "Installable package. Open the installer (web/make_site.py, see BUILDING.md), connect the FM-1 by USB, press INSTALL. Custom firmware: at your own risk."
