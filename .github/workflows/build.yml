name: build-firmware
# Builds the installable package (build/felucca.fwsc) with JieLi's Linux toolchain, runs the host tests and, on main, publishes
#   - the package as a GitHub release (download it, or use the installer below), and
#   - a Pages site: the browser installer + editor (web/make_site.py) and the browser emulator (quest/web).
# For Pages: Settings > Pages > Source: "GitHub Actions" (no branch needed).
on:
  push:
    branches: [main, 'quest-*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  firmware:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow numpy ziglang
      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh
      - name: JieLi AC79 SDK files (vendored in assets/jieli; build.py checks their SHA-256)
        run: |
          D=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          mkdir -p $D/cfg
          cp assets/jieli/uboot.boot assets/jieli/cfg_tool.bin $D/
          cp assets/jieli/eq_cfg_hw.bin $D/cfg/
      - name: Build the firmware package
        run: |
          set +e
          sh ./build.sh > build.log 2>&1
          rc=$?
          cat build.log | tail -n 40
          if [ $rc -ne 0 ]; then
            # where the bytes are: the biggest symbols of the object
            ls build/felucca.o >/dev/null 2>&1 && $HOME/.jieli/toolchain/common/bin/objdump -t build/felucca.o 2>/dev/null | awk '{print $(NF-1), $NF}' | sort -r | head -45 > top.txt
            echo "::warning title=biggest symbols::$(cat top.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')"
            # the tail of the log as ONE annotation (readable from the checks API without a login)
            echo "::error title=build failed::$(grep -v '^\s*$' build.log | tail -n 60 | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $rc
      - name: Size of the app
        run: ls -l build/felucca.bin build/felucca.fwsc build/loader/ota.bin
      - name: Host tests
        env: { SOAK_MIN: '1' }
        run: sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-quest-firmware
          path: build/felucca.fwsc
      - name: Browser emulator (wasm)
        run: cd quest && CC=zig sh ./build.sh
      - name: Site (installer + editor + emulator)
        run: |
          python3 web/make_site.py build/felucca.fwsc quest-${{ github.run_number }} site
          mkdir -p site/emulator && cp -R quest/web/. site/emulator/
      - name: Release (main only)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp build/felucca.fwsc fm1-quest-${{ github.run_number }}.fwsc
          gh release create "quest-${{ github.run_number }}" "fm1-quest-${{ github.run_number }}.fwsc" --title "FM1 Quest build ${{ github.run_number }}" \
            --notes "Installable package. Open the installer page, connect the FM-1 by USB (a data cable, no hub), press INSTALL. Custom firmware: at your own risk; OCT- held at power-on = USB rescue."
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with: { path: site }
      - uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
